<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto - Contratas Acebo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>

<body class="bg-white text-gray-800">
  <header class="bg-gradient-to-r from-green-600 to-blue-600 text-white">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="logo.jpg" alt="Logo Contratas Acebo" class="h-12 w-auto">
        <h1 class="text-2xl font-bold">Contratas Acebo</h1>
      </div>
      <div class="mt-4 md:mt-0 text-sm text-right">
        <p><strong>Tel:</strong> 900 123 456</p>
        <p><strong>Email:</strong> info@contratasacebo.com</p>
        <p><strong>Ubicación:</strong> Carretera Villalpando n71 km2,300, Zamora, España</p>
      </div>
    </div>
  </header>

  <main class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="grid md:grid-cols-2 gap-10 max-w-6xl w-full bg-gray-100 p-8 rounded-xl shadow-lg">

      <div>
        <h2 class="text-3xl font-bold text-green-700 mb-6">Envíanos un mensaje</h2>
        <form class="grid gap-4">
          <input type="text" placeholder="Nombre" class="border p-3 rounded" required />
          <input type="email" placeholder="Correo electrónico" class="border p-3 rounded" required />
          <input type="text" placeholder="Asunto" class="border p-3 rounded" required />
          <input type="tel" placeholder="Teléfono" class="border p-3 rounded" required />
          <textarea placeholder="Mensaje" rows="5" class="border p-3 rounded" required></textarea>
          <button type="submit" class="bg-green-600 text-white py-3 px-6 rounded hover:bg-green-700">Enviar</button>
        </form>
      </div>

      <div class="flex flex-col justify-center bg-white p-6 rounded-lg shadow-md">
        <h3 class="text-2xl font-bold text-blue-700 mb-4">Información de contacto</h3>
        <p class="mb-2"><strong>Teléfono:</strong> 900 123 456</p>
        <p class="mb-4"><strong>Email:</strong> info@contratasacebo.com</p>
        <h4 class="text-lg font-semibold text-green-700 mb-2">Ubicación</h4>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1862.5786940056!2d-5.723760!3d41.531100!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd3e5d7df56df91f%3A0x0!2sZamora%2C%2049029%2C%20Zamora!5e0!3m2!1ses!2ses!4v1713108000000!5m2!1ses!2ses" width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
      </div>

    </div>
  </main>
</body>

</html>
